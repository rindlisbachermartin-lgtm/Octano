spring.application.name=OctanoBackend
spring.mvc.problemdetails.enabled=true
# Durante el desarrollo el backend escucha solo en esta computadora.
server.address=127.0.0.1
# No convertir silenciosamente 1.5 a 1 en campos enteros del formulario.
spring.jackson.deserialization.accept-float-as-int=false

# Archivo local opcional; las variables de entorno tienen prioridad.
spring.config.import=optional:file:./.env.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/octano}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway modifica el esquema; Hibernate solo comprueba que coincida con las entidades.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=octano
spring.jpa.open-in-view=false
spring.sql.init.mode=never
